<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#0a0616">
  <meta name="description" content="Troll Dash: Meme Metro — a 3D meme-coin endless runner. Dodge bear market trains, jump rug pulls, slide under laser gates, and stack Troll Coins.">
  <title>Troll Dash: Meme Metro | Troll Runner Arcade</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%230a0616'/%3E%3Ctext x='8' y='39' font-size='18' fill='%23ffb300' font-family='monospace' font-weight='900'%3E%24T%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,500;0,700;0,900;1,900&family=DM+Mono:wght@500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/games/meme-metro/styles.css?v=mm-phase3-1">
</head>
<body>
  <div id="mm-root">
    <canvas id="mm-canvas" aria-label="Troll Dash: Meme Metro endless runner"></canvas>

    <!-- Hit flash + resume countdown overlays -->
    <div id="fx-flash" aria-hidden="true"></div>
    <div id="countdown" aria-live="assertive" hidden>3</div>

    <!-- In-game HUD -->
    <div id="hud" aria-live="polite">
      <div class="hud-left">
        <button id="btn-pause" class="hud-pause" type="button" aria-label="Pause game">❚❚</button>
        <div class="hud-chip"><span class="hud-ico ico-score">★</span><strong id="hud-score">0</strong></div>
        <div class="hud-chip"><span class="hud-ico ico-best">♛</span><strong id="hud-best">0</strong></div>
        <div class="hud-chip"><span class="hud-ico ico-coin">🧌</span><strong id="hud-run-coins">0</strong></div>
        <div class="hud-chip"><span class="hud-ico ico-bank">◆</span><strong id="hud-total-coins">0</strong></div>
      </div>
      <div class="hud-right">
        <div id="hud-multiplier" class="hud-mult">x1</div>
        <span class="hud-mult-label">Multiplier</span>
      </div>
    </div>

    <!-- Main menu -->
    <section id="screen-menu" class="screen is-visible" aria-label="Main menu">
      <div class="menu-panel">
        <div class="logo">
          <span class="logo-troll">TROLL DASH</span>
          <span class="logo-metro">MEME METRO</span>
        </div>
        <p class="menu-tag">Run the metro. Dodge the rugs. Stack Troll Coins.</p>

        <div class="menu-stats">
          <div class="stat-chip"><span>Best</span><strong id="menu-highscore">0</strong></div>
          <div class="stat-chip is-coin"><span>Troll Coins</span><strong id="menu-coins">0</strong></div>
        </div>

        <button id="btn-start" class="btn-primary" type="button">▶ START</button>

        <div class="menu-nav" aria-label="Coming soon sections">
          <button class="menu-nav-btn" type="button" disabled>Characters<small>Soon</small></button>
          <button class="menu-nav-btn" type="button" disabled>Shop<small>Soon</small></button>
          <button class="menu-nav-btn" type="button" disabled>Missions<small>Soon</small></button>
          <button class="menu-nav-btn" type="button" disabled>Leaderboard<small>Soon</small></button>
          <button class="menu-nav-btn" type="button" disabled>Settings<small>Soon</small></button>
        </div>

        <div class="menu-controls">
          <span><kbd>A</kbd><kbd>D</kbd> lanes</span>
          <span><kbd>W</kbd>/<kbd>Space</kbd> jump</span>
          <span><kbd>S</kbd> slide</span>
          <span class="mobile-only">📱 swipe to move</span>
        </div>

        <a class="menu-back" href="/">← Back to Arcade</a>
      </div>
    </section>

    <!-- Pause menu -->
    <section id="screen-pause" class="screen" aria-label="Pause menu">
      <div class="dialog-panel">
        <h2 class="dialog-title">PAUSED</h2>
        <div class="dialog-actions">
          <button id="btn-resume" class="btn-primary" type="button">▶ Resume</button>
          <button id="btn-restart-pause" class="btn-secondary" type="button">↻ Restart</button>
          <button class="btn-secondary" type="button" disabled>Missions · Soon</button>
          <button class="btn-secondary" type="button" disabled>Settings · Soon</button>
          <button id="btn-exit-pause" class="btn-ghost" type="button">Exit to Menu</button>
        </div>
      </div>
    </section>

    <!-- Game over -->
    <section id="screen-gameover" class="screen" aria-label="Game over">
      <div class="dialog-panel">
        <h2 class="dialog-title is-danger">GAME OVER</h2>
        <p id="go-cause" class="go-cause">Rekt by: obstacle</p>
        <span id="go-newbest" class="go-newbest" hidden>NEW BEST!</span>
        <dl class="go-stats">
          <div><dt>Final Score</dt><dd id="go-score">0</dd></div>
          <div><dt>Coins Earned</dt><dd id="go-coins" class="is-coin">0</dd></div>
          <div><dt>Distance</dt><dd id="go-distance">0.00 KM</dd></div>
          <div><dt>Best Score</dt><dd id="go-best">0</dd></div>
        </dl>
        <div class="dialog-actions">
          <button id="btn-restart" class="btn-primary" type="button">↻ Restart</button>
          <button id="btn-exit" class="btn-ghost" type="button">Exit to Menu</button>
        </div>
      </div>
    </section>
  </div>

  <script type="importmap">
    { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" } }
  </script>
  <script type="module" src="assets/games/meme-metro/src/main.js?v=mm-phase3-1"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://mayurski-art.github.io/assets/js/troll-notis.js"></script>
</body>
</html>
