<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self';">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Kitchen3D preview (dev only) | Papa Troll's Pizzeria</title>
  <style>
    html, body { margin: 0; height: 100%; background: #1a0f08; font-family: system-ui, sans-serif; }
    #k3d-mount { position: relative; width: 100vw; height: 100vh; overflow: hidden; }
    .k3d-canvas { display: block; width: 100%; height: 100%; }
    .k3d-prompt {
      position: absolute; left: 50%; bottom: 14%; transform: translateX(-50%);
      background: rgba(0,0,0,0.65); color: #fff3dd; padding: 8px 16px; border-radius: 10px;
      font-size: 15px; white-space: nowrap; pointer-events: none;
    }
    .k3d-look-hint {
      position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
      background: rgba(0,0,0,0.7); color: #fff; padding: 12px 20px; border-radius: 10px;
      font-size: 14px; text-align: center; pointer-events: none;
    }
    .k3d-station-label { display: none; } /* projected labels land in phase 3 */
    #k3d-fallback { color: #fff3dd; padding: 40px; font-size: 18px; }
  </style>
</head>
<body>
  <div id="k3d-mount">
    <p id="k3d-fallback">Loading Kitchen3D…</p>
  </div>

  <script type="importmap">
    { "imports": { "three": "./assets/vendor/three.module.min.js" } }
  </script>
  <script type="module" src="assets/games/troll-pizzeria/kitchen3d.js?v=k3d-phase1"></script>
  <script>
    window.addEventListener("kitchen3d:ready", (e) => {
      const mount = document.getElementById("k3d-mount");
      const fb = document.getElementById("k3d-fallback");
      if (e.detail.ok) {
        fb.remove();
        window.TrollKitchen3D.mount(mount);
      } else {
        fb.textContent = "WebGL unavailable — Kitchen3D needs a browser with WebGL support.";
      }
    });
  </script>
</body>
</html>
